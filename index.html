    <meta property="og:url" content="https://signbridge-3d.vercel.app" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SignBridge 3D — Learn. Sign. Speak. Connect." />

      name="twitter:description"
